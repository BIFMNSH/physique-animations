.ej{width:12px;height:12px;position:relative}

.circuit{opacity:0;transition:opacity 1s}

.real,.sch{transition:opacity .6s}
.sch{opacity:0}
.schema .sch{opacity:1}
.schema .real{opacity:0}
.flowdots{opacity:0;transition:opacity .6s}
.flow .flowdots{opacity:1;animation:dash .9s linear infinite}
.glow{opacity:0;transition:opacity 1s .4s}
.flow .glow{opacity:1;animation:pulse 2.4s ease-in-out infinite}
.bulb{fill:#3A4560;transition:fill 1s .4s}

.dir{opacity:0;transform:translateY(8px);transition:opacity .7s,transform .7s}
.show-dir .dir{opacity:1;transform:none}
.dir-conv{opacity:0;transition:opacity .7s .5s}
.show-conv .dir-conv{opacity:1}

<script>
(function () {
  var S = 76, DY = 65.82;
  function rnd(i) { var x = Math.sin(i * 12.9898 + 4.1) * 43758.5453; return x - Math.floor(x); }
  var bubble = document.getElementById('bubble'), layer = document.getElementById('eLayer');
  var html = '';
  for (var r = 0; r < 8; r++) for (var c = -1; c < 7; c++) {
    var x = (r % 2 ? S / 2 : 0) - 10 + c * S, y = 20 + r * DY;
    html += '<div class="atom" style="left:' + (x - 35) + 'px;top:' + (y - 35) + 'px"></div>';
  }
  bubble.insertAdjacentHTML('afterbegin', html);
  var eh = '', angles = [];
  for (var r2 = 0; r2 < 7; r2++) for (var c2 = -4; c2 < 7; c2++) {
    var m = ((c2 % 2) + 2) % 2;
    var xa = (r2 % 2 ? S / 2 : 0) - 10 + c2 * S, ya = 20 + r2 * DY;
    var cand = [{ x: xa + S / 2, y: ya + DY / 3, k: r2 * 11 + m * 3 + 1, f: false }, { x: xa, y: ya + 2 * DY / 3, k: r2 * 13 + m * 5 + 7, f: r2 === 3 && m === 0 }];
    cand.forEach(function (s) {
      if (!s.f && rnd(s.k) < 0.42) return;
      var v = 1 + Math.floor(rnd(s.k + 50) * 4), d = (1.1 + rnd(s.k + 90) * 0.9).toFixed(2), del = (rnd(s.k + 130) * 2).toFixed(2);
      angles.push(Math.round(rnd(s.k + 170) * 360));
      eh += '<div class="e" style="left:' + (s.x + 146).toFixed(1) + 'px;top:' + (s.y - 6).toFixed(1) + 'px"><div class="ej" style="animation:j' + v + ' ' + d + 's -' + del + 's ease-in-out infinite alternate"><div class="arr"></div><div class="dot"></div></div></div>';
    });
  }
  layer.innerHTML = eh;
  var arrows = layer.querySelectorAll('.arr');
  function orient(flow) { arrows.forEach(function (a, i) { a.style.transform = 'rotate(' + (flow ? 0 : angles[i]) + 'deg)'; }); }

  var viewBtn = document.createElement('button');
  viewBtn.className = 'view-btn';
  viewBtn.setAttribute('aria-pressed', 'false');
  viewBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="3" width="14" height="12"/><line x1="7" y1="1" x2="7" y2="5"/><line x1="10" y1="0" x2="10" y2="6"/></svg><span>Voir le schéma</span>';

  var D1 = 'Document 1 · lame seule', D2 = 'Document 2 · circuit fermé';
  var player = Player({
    stepSeconds: 6,
    extraControl: viewBtn,
    steps: [
      { chip: 'La lame', badge: D1, badgeColor: '#F2A866', title: 'Une lame de cuivre', text: 'Un métal comme le cuivre paraît plein et immobile. Zoomons très fort sur la matière…' },
      { chip: 'Le zoom', badge: D1, badgeColor: '#F2A866', title: 'Zoom sur la matière', text: 'À l’échelle microscopique, le cuivre est un empilement d’atomes très serrés.' },
      { chip: 'Légende', badge: D1, badgeColor: '#F2A866', title: 'Atomes, noyaux et électrons libres', text: 'Chaque atome possède un noyau. Certains électrons ne sont attachés à aucun atome : ce sont les électrons libres.' },
      { chip: 'Désordre', badge: D1, badgeColor: '#F2A866', title: 'Sans générateur : du désordre', text: 'Les électrons libres s’agitent dans toutes les directions. En moyenne, ils ne vont nulle part : il n’y a pas de courant.' },
      { chip: 'Circuit fermé', badge: D2, badgeColor: '#5CC8FF', title: 'On ferme le circuit', text: 'Le générateur met tous les électrons libres en mouvement dans le même sens. La lampe s’allume !' },
      { chip: 'Le courant', badge: D2, badgeColor: '#5CC8FF', title: 'Le courant électrique', text: 'Le courant électrique dans un métal est un déplacement d’ensemble des électrons libres, de la borne − vers la borne + à l’extérieur du générateur.' }
    ],
    flags: function (s) {
      return [s >= 1 && 'show-bubble', s >= 2 && 'show-e', (s === 2 || s === 3) && 'show-labels', s >= 4 && 'show-circuit', s >= 4 && 'flow', s >= 5 && 'show-dir', s >= 5 && 'show-conv'].filter(Boolean).join(' ');
    },
    onStep: function (s) { orient(s >= 4); }
  });
  viewBtn.addEventListener('click', function () {
    var on = viewBtn.getAttribute('aria-pressed') !== 'true';
    viewBtn.setAttribute('aria-pressed', String(on));
    viewBtn.querySelector('span').textContent = on ? 'Vue réaliste' : 'Voir le schéma';
    player.setExtra('schema', on);
  });
})();
</script>
