<title>Le courant dans les solutions ioniques · Physique-chimie en animations</title>
<meta name="description" content="Animation : pourquoi certaines solutions conduisent le courant électrique ? Molécules, ions et déplacement des ions.">

<style>
.bubble{background:#E3F2FC;transform:scale(.15);opacity:0;transition:transform 1.1s cubic-bezier(.2,1.3,.4,1),opacity .6s,background 1s}
.show-bubble .bubble{transform:scale(1);opacity:1}
.cu .bubble{background:#B7D7F4}
.conn{stroke-dasharray:600;stroke-dashoffset:600;transition:stroke-dashoffset 1.2s ease .2s}
.show-bubble .conn{stroke-dashoffset:0}
.mol{position:absolute;width:30px;height:24px}
.mol .in{width:30px;height:24px;position:relative}
.mol .o{position:absolute;left:7px;top:3px;width:16px;height:16px;border-radius:50%;background:#E5484D}
.mol .h{position:absolute;top:14px;width:9px;height:9px;border-radius:50%;background:#FFFFFF;box-shadow:0 0 0 1px #9AA5B8}
.sugar-layer{position:absolute;inset:0;opacity:0;transition:opacity .8s}
.sugar .sugar-layer{opacity:1}
.sug{position:absolute}
.sug .b{width:58px;height:34px;border-radius:12px;background:#5B4A3F;border:2px solid #FFFFFF;color:#FFFFFF;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.ion-layer{position:absolute;top:0;width:560px;height:420px;opacity:0;transition:opacity .8s}
.ions .ion-layer{opacity:1}
.cat-layer{left:-140px}.an-layer{left:0}
.cond .cat-layer{animation:driftR 3.2s linear 1.2s infinite}
.cond .an-layer{animation:driftL 3.2s linear 1.2s infinite}
.weak .cat-layer{animation:driftR 8s linear 1.2s infinite}
.weak .an-layer{animation:driftL 8s linear 1.2s infinite}
.ion{position:absolute}
.ion .b{transform:translate(-50%,-50%);border-radius:50%;border:2px solid #FFFFFF;color:#FFFFFF;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:opacity .6s,background .6s}
.liquid{fill:#9FD3F5;fill-opacity:.55;transition:fill 1s,fill-opacity 1s}
.weak .liquid{fill:#B9E0F7}
.cu .liquid{fill:#3F8EE0;fill-opacity:.75}
.flowdots{opacity:0;transition:opacity .6s}
.cond .flowdots{opacity:1;animation:dash .9s linear infinite}
.weak .flowdots{opacity:.55;animation:dash 2.8s linear infinite}
.glow{opacity:0;transition:opacity 1s .4s}
.cond .glow{opacity:1;animation:pulse 2.4s ease-in-out infinite}
.bulb{fill:#3A4560;transition:fill 1s .4s}
.cond .bulb{fill:#FFE27A}
.amp-off{opacity:1;transition:opacity .5s}
.amp-on,.amp-weak{opacity:0;transition:opacity .5s .4s}
.cond .amp-off,.weak .amp-off{opacity:0}
.cond .amp-on,.weak .amp-weak{opacity:1}
.dir{opacity:0;transform:translateY(8px);transition:opacity .7s,transform .7s}
.show-dir .dir{opacity:1;transform:none}
.electrode{position:absolute;top:0;width:34px;height:420px;background:#8A94A6;display:flex;align-items:center;box-sizing:border-box;color:#FFFFFF;font-size:24px;font-weight:700}
.legend{position:absolute;left:730px;top:450px;width:460px;display:flex;justify-content:center;gap:16px;flex-wrap:wrap}
.legend .it{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--soft)}
.legend .d{width:14px;height:14px;border-radius:50%;border:1.5px solid #FFFFFF}
@keyframes driftR{from{transform:translateX(0)}to{transform:translateX(140px)}}
@keyframes driftL{from{transform:translateX(0)}to{transform:translateX(-140px)}}
text{font-family:'Atkinson Hyperlegible',sans-serif;font-weight:700}
</style>

<script>
(function () {
  function rnd(i) { var x = Math.sin(i * 12.9898 + 7.3) * 43758.5453; return x - Math.floor(x); }
  function jig(k) {
    return 'animation:j' + (1 + Math.floor(rnd(k + 50) * 4)) + ' ' + (1.2 + rnd(k + 90)).toFixed(2) + 's -' + (rnd(k + 130) * 2).toFixed(2) + 's ease-in-out infinite alternate';
  }
  var h = '';
  for (var i = 0; i < 22; i++) {
    h += '<div class="mol" style="left:' + (45 + rnd(i * 3 + 1) * 320).toFixed(0) + 'px;top:' + (25 + rnd(i * 3 + 2) * 360).toFixed(0) + 'px;transform:rotate(' + Math.round(rnd(i * 3 + 3) * 360) + 'deg)"><div class="in" style="' + jig(i * 7) + '"><div class="o"></div><div class="h" style="left:1px"></div><div class="h" style="left:20px"></div></div></div>';
  }
  document.getElementById('water').innerHTML = h;
  document.getElementById('sugar').innerHTML = [[90, 70], [250, 120], [140, 230], [280, 300], [80, 340]].map(function (p, k) {
    return '<div class="sug" style="left:' + p[0] + 'px;top:' + p[1] + 'px"><div style="' + jig(300 + k * 11) + '"><div class="b">sucre</div></div></div>';
  }).join('');
  var P = 140, catBase = [[20, 70], [80, 190], [40, 310], [110, 380]], anBase = [[60, 130], [120, 250], [10, 240], [90, 40]];
  function ions(base, seed) {
    var out = '';
    for (var b = 0; b < 4; b++) base.forEach(function (p, k) {
      out += '<div class="ion" style="left:' + (b * P + p[0]) + 'px;top:' + p[1] + 'px"><div style="' + jig(seed + k * 17 + b) + '"><div class="b"></div></div></div>';
    });
    return out;
  }
  var catBox = document.getElementById('cations'), anBox = document.getElementById('anions');
  catBox.innerHTML = ions(catBase, 500); anBox.innerHTML = ions(anBase, 700);
  var catEls = catBox.querySelectorAll('.b'), anEls = anBox.querySelectorAll('.b');
  var legend = document.getElementById('legend');

  var NA = { s: 32, bg: '#7C3AED', l: 'Na⁺' }, CL = { s: 38, bg: '#15803D', l: 'Cl⁻' };
  var CA = { s: 34, bg: '#0F766E', l: 'Ca²⁺' }, HCO3 = { s: 46, bg: '#9D174D', l: 'HCO₃⁻', f: 11 };
  var CU = { s: 34, bg: '#2563EB', l: 'Cu²⁺' }, SO4 = { s: 44, bg: '#B45309', l: 'SO₄²⁻' };
  function paint(els, look, sparse, keep) {
    els.forEach(function (e, k) {
      e.style.width = e.style.height = look.s + 'px';
      e.style.background = look.bg;
      e.style.fontSize = (look.f || 12) + 'px';
      e.textContent = look.l;
      e.style.opacity = sparse && k % 4 !== keep ? '0' : '1';
    });
  }
  function dot(bg, label) { return '<div class="it"><span class="d" style="background:' + bg + '"></span><span>' + label + '</span></div>'; }

  var NC = 'Non conductrice', GREY = '#A9B4C7', YEL = '#FFE27A';
  Player({
    stepSeconds: 6,
    steps: [
      { chip: 'Montage', badge: 'Montage', badgeColor: GREY, title: 'Le montage', text: 'Un générateur, une lampe et un ampèremètre en série : le courant est obligé de traverser le liquide du bécher, entre deux électrodes.' },
      { chip: 'Eau pure', badge: NC, badgeColor: GREY, title: 'Eau déminéralisée : H₂O', text: 'Elle ne contient que des molécules d’eau, électriquement neutres. La lampe reste éteinte, l’ampèremètre indique 0 : non conductrice.' },
      { chip: 'Eau sucrée', badge: NC, badgeColor: GREY, title: 'Eau sucrée : H₂O et C₁₂H₂₂O₁₁', text: 'On ajoute des molécules de sucre, elles aussi neutres. Toujours aucun courant : non conductrice.' },
      { chip: 'Eau du robinet', badge: 'Faiblement conductrice', badgeColor: '#FDBA74', title: 'Eau du robinet : H₂O et un peu d’ions', text: 'Les sels minéraux y apportent quelques ions (Ca²⁺, HCO₃⁻…). Trop peu pour allumer la lampe, mais l’ampèremètre détecte un courant très faible : faiblement conductrice.' },
      { chip: 'Eau salée', badge: 'Conductrice', badgeColor: YEL, title: 'Eau salée : H₂O, Na⁺ et Cl⁻', text: 'Beaucoup plus d’ions : des particules qui portent une charge électrique. La lampe s’allume : conductrice !' },
      { chip: 'Sulfate Cu', badge: 'Conductrice', badgeColor: YEL, title: 'Sulfate de cuivre (II) : H₂O, Cu²⁺ et SO₄²⁻', text: 'Encore des ions, encore du courant : la solution est conductrice.' },
      { chip: 'Les ions', badge: 'Conductrice', badgeColor: YEL, title: 'Les ions se déplacent', text: 'Dans la solution, le courant est dû au déplacement des ions : les ions positifs (cations) et les ions négatifs (anions) se déplacent en sens inverse.' },
      { chip: 'Conclusion', badge: 'À retenir', badgeColor: '#5CC8FF', title: 'Conclusion', text: 'Une solution est conductrice si elle contient des ions, et d’autant mieux qu’elle en contient beaucoup. La formule d’un ion porte une charge en exposant : + ou − (Na⁺, Cl⁻, Cu²⁺, SO₄²⁻).' }
    ],
    flags: function (s) {
      return [s >= 1 && 'show-bubble', s === 2 && 'sugar', s >= 3 && 'ions', s === 3 && 'weak', s >= 4 && 'cond', s >= 5 && 'cu', s >= 6 && 'show-dir'].filter(Boolean).join(' ');
    },
    onStep: function (s) {
      var weak = s === 3, cu = s >= 5;
      var cat = cu ? CU : weak ? CA : NA, an = cu ? SO4 : weak ? HCO3 : CL;
      paint(catEls, cat, weak, 1); paint(anEls, an, weak, 2);
      var lg = s >= 1 ? dot('#E5484D', 'molécule d’eau H₂O') : '';
      if (s === 2) lg += dot('#5B4A3F', 'molécule de sucre');
      if (s >= 3) lg += dot(cat.bg, cat.l + ' : cation (+)') + dot(an.bg, an.l + ' : anion (−)');
      legend.innerHTML = lg;
    }
  });
})();
</script>
