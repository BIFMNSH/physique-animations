  }

  /* ================= Actions sur les tubes ================= */
  $('bShake').onclick = function () { var tb = tubes[active]; if (volume(tb) < 0.01) return; beginAct(active, 'shake'); tb.shaken = true; tb.settle = 0; addAct(active, 'tube agité', 'shake', 0, ''); say('Tube ' + (active + 1) + ' agité : le précipité se répartit, puis redescend.', ''); };
  $('bEmpty').onclick = function () {
    var tb = tubes[active]; if (volume(tb) < 0.01) return;
    beginAct(active, 'empty');
    for (var k in tb.vol) tb.vol[k] *= 0.03; tb.drops.soude = Math.round(tb.drops.soude * 0.03); tb.drops.nitrate = Math.round(tb.drops.nitrate * 0.03);
    PPT_KEYS.forEach(function (k) { tb.shown[k] *= 0.03; });
    addAct(active, 'tube vidé (sans rinçage)', 'empty', 0, ''); renderLabels();
    say('Tube vidé mais pas rincé : il reste des traces qui peuvent fausser le prochain test.', 'warn');
  };
  function rinse(i) { tubes[i] = newTube(); }
  $('bRinse').onclick = function () { beginAct(active, 'rinse'); rinse(active); addAct(active, 'tube rincé', 'rinse', 0, ''); renderLabels(); say('Tube ' + (active + 1) + ' rincé et propre.', 'ok'); };
  $('bRinseAll').onclick = function () { for (var i = 0; i < N; i++) { beginAct(i, 'rinse'); rinse(i); } addSys('Tous les tubes rincés.'); renderLabels(); say('Tous les tubes sont propres.', 'ok'); };

  /* ================= Barre du haut ================= */
  document.querySelectorAll('[data-epi]').forEach(function (b) {
    b.onclick = function () {
      var k = b.getAttribute('data-epi'); epi[k] = !epi[k]; b.setAttribute('aria-pressed', String(epi[k]));
      if (!epi[k] && hand && hand.indexOf('d:') === 0) { hand = null; renderShelf(); renderPour(); }
      say(epi.blouse && epi.lunettes && epi.gants ? 'Bien équipé(e) : tu peux manipuler les détecteurs.' : '', 'ok');
    };
  });
  $('lamp').onclick = function () { lampOn = !lampOn; this.setAttribute('aria-pressed', String(lampOn)); document.querySelector('.backdrop').classList.toggle('lit', lampOn); addSys(lampOn ? 'Lampe allumée.' : 'Lampe éteinte.'); };
  $('speed').onclick = function () { speed = speed === 1 ? 10 : 1; this.setAttribute('aria-pressed', String(speed > 1)); this.querySelector('span').textContent = 'Temps ×' + speed; };
  function setMode(m) {
    mode = m; $('mLibre').setAttribute('aria-pressed', String(m === 'libre')); $('mDefi').setAttribute('aria-pressed', String(m === 'defi'));
    if (m === 'defi') showTab('defi');
    if (hand && hand.indexOf('u:') === 0 && m === 'libre') hand = null;
    renderShelf(); renderPour(); renderDefi();
  }
  $('mLibre').onclick = function () { setMode('libre'); };
  $('mDefi').onclick = function () { setMode('defi'); };
  function showTab(t) {
    $('tCahier').setAttribute('aria-selected', String(t === 'cahier')); $('tDefi').setAttribute('aria-selected', String(t === 'defi'));
    $('pCahier').hidden = t !== 'cahier'; $('pDefi').hidden = t !== 'defi';
  }
  $('tCahier').onclick = function () { showTab('cahier'); };
  $('tDefi').onclick = function () { showTab('defi'); if (mode !== 'defi') setMode('defi'); };

  /* ================= Panneau défi + réponses ================= */
  function renderDefi() {
    var c = $('defiCard'), a = $('ansCard');
    if (!defi) { c.innerHTML = '<h3>Les défis</h3><p>Identifie des ions dans des flacons dont l’étiquette a disparu. Ton professeur peut donner le même code à toute la classe.</p>'; a.hidden = true; $('chooser').hidden = false; return; }
    c.innerHTML = '<h3>' + DEFIS[defi.type].title + '</h3><p>' + DEFIS[defi.type].text + '</p><p>Code : <span class="code">' + defi.code + '</span> <button class="linkish" id="bChange">' + (chooserOpen ? 'Fermer' : 'Changer de défi') + '</button></p>';
    $('chooser').hidden = !chooserOpen;
    $('bChange').onclick = function () { chooserOpen = !chooserOpen; renderDefi(); };
    a.hidden = chooserOpen;
    var opts = ['cu', 'fe2', 'fe3', 'zn', 'cl', 'none'];
    a.innerHTML = '<p><b>Mes réponses</b> : coche les ions détectés.</p>' + defi.flasks.map(function (f) {
      var sel = answers[f.id] || {};
      var res = '';
      if (defi.checked) { var good = flaskOk(f); res = '<span class="fl-res ' + (good ? 'ok' : 'ko') + '">' + (good ? '✓ juste' : '✗ à revoir') + '</span>'; }
      return '<div class="fl"><b>' + f.name + ' ' + res + '</b><div class="chips2">' + opts.map(function (o) {
        return '<button data-f="' + f.id + '" data-o="' + o + '" aria-pressed="' + !!sel[o] + '">' + (o === 'none' ? 'aucun' : ION_LABEL[o]) + '</button>';
      }).join('') + '</div></div>';
    }).join('') + '<button class="act-btn main" id="bCheck" style="align-self:flex-start">Vérifier mes réponses</button><div class="res" id="score"></div>';
    if (defi.checked) showScore();
    $('bCheck').onclick = function () { defi.checked = true; renderDefi(); };
  }
  function flaskOk(f) {
    var sel = answers[f.id] || {}, picked = Object.keys(sel).filter(function (k) { return sel[k]; });
    var truth = f.ions.length ? f.ions : ['none'];
    return picked.length === truth.length && truth.every(function (t) { return sel[t]; });
  }
  function score() { return defi.flasks.filter(flaskOk).length; }
  function showScore() {
    var s = score(), n = defi.flasks.length;
    $('score').textContent = s === n ? 'Bravo, tout est juste (' + s + '/' + n + ') !' : s + ' / ' + n + ' flacon' + (n > 1 ? 's' : '') + ' correct' + (s > 1 ? 's' : '') + '. Refais les tests pour les flacons à revoir.';
    $('score').style.color = s === n ? '#3DD68C' : '#FCA5A5';
  }
  $('ansCard').addEventListener('click', function (e) {
    var b = e.target.closest('[data-f]'); if (!b) return;
    var f = b.getAttribute('data-f'), o = b.getAttribute('data-o'), sel = answers[f] = answers[f] || {};
    if (o === 'none') { answers[f] = sel = { none: !sel.none }; }
    else { sel[o] = !sel[o]; sel.none = false; }
    defi.checked = false; renderDefi();
  });
  $('bLoad').onclick = function () { loadDefi($('codeIn').value); };
  $('codeIn').addEventListener('keydown', function (e) { if (e.key === 'Enter') loadDefi(this.value); });
  document.querySelectorAll('[data-new]').forEach(function (b) { b.onclick = function () { newDefi(+b.getAttribute('data-new')); }; });

  /* ================= Message ================= */
  var msgTimer = null;
  function say(t, kind) {
    var m = $('msg'); m.textContent = t; m.className = 'msg' + (kind ? ' ' + kind : '');
    clearTimeout(msgTimer); if (t) msgTimer = setTimeout(function () { m.textContent = ''; }, 9000);
  }

  /* ================= Compte rendu imprimable ================= */
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function buildReport() {
    var rows = log.filter(function (e) { return !e.sys; }).map(function (e) {
      var o = e.frozen ? e.obs : (e.unit ? describe(tubes[e.tube]) : '');
      return '<tr><td>' + (e.tube + 1) + '</td><td>' + esc(entryText(e)) + '</td><td>' + esc(o) + '</td></tr>';
    }).join('');
    var d = new Date();
    var h = '<h1>Compte rendu — Labo virtuel</h1><div class="meta"><span><b>Nom :</b> ' + esc($('nom').value || '..............................') + '</span><span><b>Classe :</b> ' + esc($('classe').value || '..........') + '</span><span><b>Date :</b> ' + d.toLocaleDateString('fr-FR') + '</span></div>';
    if (defi) h += '<h2>Défi ' + defi.code + ' : ' + DEFIS[defi.type].title + '</h2><p>' + DEFIS[defi.type].text + '</p>';
    h += '<h2>Manipulations et observations</h2><table><thead><tr><th>Tube</th><th>Manipulation</th><th>Observation</th></tr></thead><tbody>' + (rows || '<tr><td colspan="3">Aucune manipulation.</td></tr>') + '</tbody></table>';
    h += '<h2>Conclusion</h2><div class="box">' + esc($('concl').value || '') + '</div>';
    if (defi) {
      h += '<h2>Réponses</h2><table><thead><tr><th>Flacon</th><th>Ions trouvés</th>' + (defi.checked ? '<th>Vérification</th>' : '') + '</tr></thead><tbody>' + defi.flasks.map(function (f) {
        var sel = answers[f.id] || {}, picked = Object.keys(sel).filter(function (k) { return sel[k]; }).map(function (k) { return k === 'none' ? 'aucun' : ION_LABEL[k]; }).join(', ') || '—';
        var truth = f.ions.length ? f.ions : ['none'], ok = truth.length === Object.keys(sel).filter(function (k) { return sel[k]; }).length && truth.every(function (t) { return sel[t]; });
        return '<tr><td>' + f.name + '</td><td>' + picked + '</td>' + (defi.checked ? '<td>' + (ok ? 'juste' : 'à revoir') + '</td>' : '') + '</tr>';
      }).join('') + '</tbody></table>';
    }
    $('report').innerHTML = h;
  }
  $('bPrint').onclick = function () { buildReport(); window.print(); };
  window.addEventListener('beforeprint', buildReport);

  /* ================= Boucle de simulation ================= */
  var prev = performance.now(), acc = 0;
  function frame(now) {
    var rdt = Math.max(0, Math.min(0.1, (now - prev) / 1000)); prev = now;
    var dt = rdt * speed;
    tubes.forEach(function (tb, i) {
      var eq = equilibrium(tb);
      PPT_KEYS.forEach(function (k) { tb.shown[k] += (eq.p[k] - tb.shown[k]) * Math.min(1, dt * 1.6); });
      tb.settle = Math.min(1, tb.settle + dt * 0.11);
      if (tb.shown.agcl > 0.05) tb.expo += dt * (lampOn ? 1 : 0.1);
      drawTube(i);
    });
    drawFx(rdt);
    acc += rdt;
    if (acc > 0.6) { acc = 0; renderLog(); renderLabels(); }
    requestAnimationFrame(frame);
  }

  buildTubes(); renderShelf(); renderPour(); renderLog(); renderDefi(); renderLabels();
  var q = /[?&]defi=([^&]+)/.exec(location.search);
  if (q) loadDefi(decodeURIComponent(q[1]));
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
