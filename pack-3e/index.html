<title>Pack 3e MENA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:wght@600;800&display=swap">
<style>/* Pack 3e — cahier de labo : papier quadrillé bleu, encre marine, accent orange */
:root{
  --bg:#EEF3F8; --grid:#D7E2EE; --card:#FFFFFF; --ink:#142238; --muted:#546680; --line:#C5D3E3;
  --accent:#D9480F; --accent-ink:#FFFFFF; --link:#1B5FBF;
  --ok:#1E8E4E; --warn:#B7791F; --bad:#C92A2A;
  --scene:#FBFDFF; --scene2:#E6EEF7; --scene-line:#7C8DA6; --scene-text:#142238; --scene-muted:#60718B;
  --s1:#2F6FDB; --s2:#E8590C; --s3:#2B9A66; --s4:#8B5CF6; --s5:#D6336C;
  --metal:#9AA7B8; --water:#7DB8F0; --glass:#BBD9F5;
  --f-disp:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif; --f-body:'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1522; --grid:#18243A; --card:#152033; --ink:#E7EEF8; --muted:#97A8C0; --line:#2B3B57;
  --accent:#FF7A33; --accent-ink:#1A0E05; --link:#7DB2FF;
  --ok:#4CC38A; --warn:#E5B34D; --bad:#FF7B7B;
  --scene:#0F1A2C; --scene2:#1A2A44; --scene-line:#6F84A3; --scene-text:#E7EEF8; --scene-muted:#9FB0C9;
  --s1:#6FA3FF; --s2:#FF8A4C; --s3:#49C58C; --s4:#B49BFF; --s5:#FF7BA9;
  --metal:#7D8BA0; --water:#3E7FC0; --glass:#2F5F94; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1522; --grid:#18243A; --card:#152033; --ink:#E7EEF8; --muted:#97A8C0; --line:#2B3B57;
  --accent:#FF7A33; --accent-ink:#1A0E05; --link:#7DB2FF;
  --ok:#4CC38A; --warn:#E5B34D; --bad:#FF7B7B;
  --scene:#0F1A2C; --scene2:#1A2A44; --scene-line:#6F84A3; --scene-text:#E7EEF8; --scene-muted:#9FB0C9;
  --s1:#6FA3FF; --s2:#FF8A4C; --s3:#49C58C; --s4:#B49BFF; --s5:#FF7BA9;
  --metal:#7D8BA0; --water:#3E7FC0; --glass:#2F5F94; color-scheme:dark}
*{box-sizing:border-box}
body{background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;margin:0}
#app{max-width:1180px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-disp);line-height:1.15;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--link)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top .brand{font-family:var(--f-disp);font-weight:800;font-size:15px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.top .sp{flex:1}
.pill{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:14px;min-height:44px}
.pill:hover{border-color:var(--accent)}
.home h1{font-size:clamp(30px,5vw,48px);font-weight:800;max-width:18ch}
.home .lead{max-width:62ch;color:var(--muted);margin:10px 0 26px}
.theme-h{font-family:var(--f-disp);font-weight:700;font-size:20px;margin:28px 0 10px;display:flex;align-items:baseline;gap:10px}
.theme-h small{font-family:var(--f-body);font-weight:400;color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;text-align:left;text-decoration:none;color:inherit;position:relative}
a.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card h3{font-size:18px}
.card p{margin:0;color:var(--muted);font-size:14.5px}
.card .thumb{height:78px;border-radius:8px;background:var(--scene);border:1px solid var(--line);overflow:hidden}
.card .thumb svg{width:100%;height:100%;display:block}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12.5px;border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--muted);background:var(--bg)}
.chip.les{border-color:var(--accent);color:var(--accent)}
.badge{position:absolute;top:10px;right:10px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--ok);color:#fff}
.mod .back{margin-bottom:10px;display:inline-flex}
.mod h2{font-size:clamp(26px,4vw,38px);font-weight:800}
.mod .obj{color:var(--muted);max-width:70ch;margin:6px 0 10px}
.layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr);gap:16px;margin-top:14px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
.box{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px}
.scene{width:100%;height:auto;display:block;background:var(--scene);border:1.5px solid var(--line);border-radius:12px;touch-action:none;user-select:none;-webkit-user-select:none}
.scene text{font-family:var(--f-body);fill:var(--scene-text)}
.msg{min-height:44px;margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--scene2);font-size:15px}
.msg.ok{border-left:5px solid var(--ok)}.msg.warn{border-left:5px solid var(--warn)}.msg.bad{border-left:5px solid var(--bad)}
.chartbox{margin-top:12px}
.panel{display:flex;flex-direction:column;gap:12px}
.steps{margin:0;padding-left:22px;font-size:15px}
.steps li{margin:3px 0}
.ctl{display:flex;flex-direction:column;gap:4px;padding:6px 0;border-top:1px dashed var(--line)}
.ctl:first-child{border-top:0}
.ctl label,.ctl .lab{font-size:14px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.ctl output{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:700}
input[type=range]{width:100%;height:44px;accent-color:var(--accent);margin:0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:44px;padding:6px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{min-height:44px;padding:8px 16px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-weight:700}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap}
.reads{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.read{background:var(--ink);color:var(--bg);border-radius:10px;padding:8px 10px;font-variant-numeric:tabular-nums}
.read small{display:block;font-size:12px;opacity:.75}
.read b{font-family:var(--f-disp);font-size:22px;font-weight:700}
table.t{width:100%;border-collapse:collapse;font-size:14.5px;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
.t th,.t td{border:1px solid var(--line);padding:6px 8px;text-align:right;white-space:nowrap}
.t th{background:var(--scene2);text-align:center;font-size:13px}
.t td:first-child,.t th:first-child{text-align:center}
.t td.txt{text-align:left;white-space:normal}
.t .x{border:0;background:none;color:var(--muted);min-width:30px;min-height:30px}
.results{margin-top:10px;padding:10px 12px;border:1.5px solid var(--accent);border-radius:10px;font-size:15px}
.results:empty{display:none}
.low{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:16px}
.low h3{font-size:19px;margin-bottom:8px}
.retiens{margin:0;padding-left:20px}
.retiens li{margin:6px 0}
.quiz .q{font-weight:700;margin:6px 0}
.quiz .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;min-height:44px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg)}
.quiz .opt.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}
.quiz .opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--card))}
.quiz .ex{font-size:14.5px;color:var(--muted);margin:6px 0}
.skills{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.sr{position:absolute;left:-9999px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.low .wide{grid-column:1/-1}
.low{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
@media (min-width:901px){.layout>div:first-child{position:sticky;top:12px}}
</style>
<div id="app"></div>
<script>/* Pack 3e — cadre commun des simulations (aucune bibliothèque, aucun réseau).
   Chaque module appelle Lab.register({...}) ; voir SPEC.md pour l'API de `c`. */
(function () {
  'use strict';
  var NS = 'http://www.w3.org/2000/svg';
  var Lab = window.Lab = { mods: [], reg: {}, cur: null };
  Lab.register = function (d) { Lab.mods.push(d); Lab.reg[d.id] = d; };

  /* ---------- petits outils ---------- */
  function h(tag, attrs, kids) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === 'text') e.textContent = attrs[k];
      else if (k === 'html') e.innerHTML = attrs[k];
      else if (k === 'class') e.className = attrs[k];
      else e.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(function (c) { if (c) e.appendChild(c); });
    return e;
  }
  var STYLE_ATTRS = { fill: 1, stroke: 1, 'stop-color': 1, color: 1 };
  function s(tag, attrs, parent) {
    var e = document.createElementNS(NS, tag);
    if (attrs) for (var k in attrs) {
      var v = attrs[k];
      if (k === 'text') e.textContent = v;
      else if (STYLE_ATTRS[k] && typeof v === 'string' && v.indexOf('var(') === 0) e.style.setProperty(k, v);
      else e.setAttribute(k, v);
    }
    if (parent) parent.appendChild(e);
    return e;
  }
  function fmt(x, d) {
    if (x === null || x === undefined || isNaN(x)) return '—';
    d = d === undefined ? 1 : d;
    return Number(x).toFixed(d).replace('.', ',').replace('-', '−');
  }
  var seed = 12345;
  function rnd() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
  function gauss() { return (rnd() + rnd() + rnd() + rnd() - 2) / 0.58; }
  function nice(lo, hi, n) {
    var span = hi - lo || 1, step = Math.pow(10, Math.floor(Math.log10(span / n))), err = span / n / step;
    step *= err >= 7.5 ? 10 : err >= 3.5 ? 5 : err >= 1.5 ? 2 : 1;
    var a = Math.ceil(lo / step - 1e-9) * step, out = [];
    for (var v = a; v <= hi + 1e-9; v += step) out.push(Math.round(v / step) * step);
    return out;
  }
  Lab.h = h; Lab.s = s; Lab.fmt = fmt;
  function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }

  /* ---------- thème ---------- */
  function applyTheme(t) { if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme'); }
  applyTheme(store('p3-theme'));
  function toggleTheme() {
    var cur = document.documentElement.getAttribute('data-theme');
    var dark = cur ? cur === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    var n = dark ? 'light' : 'dark'; applyTheme(n); store('p3-theme', n);
  }

  /* ---------- page d'accueil ---------- */
  var THEMES = [
    ['meca', 'Mécanique', 'Forces, équilibre, travail'],
    ['chimie', 'Chimie', 'Électrolyse, alcanes, oxydation, réduction'],
    ['optique', 'Optique', 'Lentilles et œil']
  ];
  function topbar(back) {
    var t = h('div', { class: 'top' });
    t.appendChild(h('span', { class: 'brand', text: 'Physique-Chimie · 3e · programme MENA' }));
    t.appendChild(h('span', { class: 'sp' }));
    var b = h('button', { class: 'pill', type: 'button', text: 'Thème clair / sombre' });
    b.onclick = toggleTheme; t.appendChild(b);
    return t;
  }
  function home(app) {
    app.innerHTML = '';
    app.appendChild(topbar());
    var sec = h('section', { class: 'home' });
    sec.appendChild(h('h1', { text: 'Le laboratoire de 3e, sans salle de TP' }));
    sec.appendChild(h('p', { class: 'lead', text: 'Neuf simulations qui suivent la progression 2026-2027 de 3e : tu manipules, tu relèves des mesures, tu conclus, puis tu vérifies avec le quiz. Un badge s’affiche quand tu réussis au moins 4 questions sur 5.' }));
    THEMES.forEach(function (th) {
      var mods = Lab.mods.filter(function (m) { return m.theme === th[0]; });
      if (!mods.length) return;
      var hh = h('div', { class: 'theme-h' }); hh.appendChild(h('span', { text: th[1] })); hh.appendChild(h('small', { text: th[2] }));
      sec.appendChild(hh);
      var g = h('div', { class: 'grid' });
      mods.forEach(function (m) {
        var a = h('a', { class: 'card', href: '#' + m.id });
        var th2 = h('div', { class: 'thumb' });
        if (m.thumb) { th2.innerHTML = '<svg viewBox="0 0 160 78" aria-hidden="true">' + m.thumb + '</svg>'; }
        a.appendChild(th2);
        a.appendChild(h('h3', { text: m.title }));
        a.appendChild(h('p', { text: m.objective }));
        var ch = h('div', { class: 'chips' });
        ch.appendChild(h('span', { class: 'chip les', text: 'Leçon : ' + m.lesson }));
        (m.skills || []).forEach(function (k) { ch.appendChild(h('span', { class: 'chip', text: k })); });
        a.appendChild(ch);
        var sc = store('p3-q-' + m.id);
        if (sc !== null && sc >= 4) a.appendChild(h('span', { class: 'badge', text: '✓ ' + sc + '/5' }));
        g.appendChild(a);
      });
      sec.appendChild(g);
    });
    app.appendChild(sec);
  }

  /* ---------- page d'un module ---------- */
  function run(def, app) {
    app.innerHTML = '';
    app.appendChild(topbar());
    var root = h('section', { class: 'mod' });
    app.appendChild(root);
    var back = h('a', { class: 'pill back', href: '#', text: '← Tous les modules' });
    root.appendChild(back);
    root.appendChild(h('h2', { text: def.title }));
    root.appendChild(h('p', { class: 'obj', text: def.objective }));
    var sk = h('div', { class: 'skills' });
    sk.appendChild(h('span', { class: 'chip les', text: 'Leçon : ' + def.lesson }));
    (def.skills || []).forEach(function (k) { sk.appendChild(h('span', { class: 'chip', text: k })); });
    root.appendChild(sk);

    var layout = h('div', { class: 'layout' }); root.appendChild(layout);
    var left = h('div'); var right = h('aside', { class: 'panel' });
    layout.appendChild(left); layout.appendChild(right);

    var H = def.height || 420, W = 800;
    var svg = s('svg', { viewBox: '0 0 ' + W + ' ' + H, class: 'scene', role: 'img', 'aria-label': def.alt || def.title });
    left.appendChild(svg);
    var msg = h('div', { class: 'msg', role: 'status', 'aria-live': 'polite', text: def.hint || 'Manipule les commandes à droite.' });
    left.appendChild(msg);
    var chartHost = h('div', { class: 'chartbox box' }); chartHost.hidden = true; left.appendChild(chartHost);

    var stepsBox = h('div', { class: 'box' });
    stepsBox.appendChild(h('h3', { text: 'À faire' }));
    var ol = h('ol', { class: 'steps' }); (def.steps || []).forEach(function (t) { ol.appendChild(h('li', { html: t })); });
    stepsBox.appendChild(ol); right.appendChild(stepsBox);
    var ctrlBox = h('div', { class: 'box' }); right.appendChild(ctrlBox);
    var readBox = h('div', { class: 'reads' }); right.appendChild(readBox);
    var actBox = h('div', { class: 'row' }); right.appendChild(actBox);

    /* Mesures */
    var low = h('div', { class: 'low' }); root.appendChild(low);
    var mBox = h('div', { class: 'box wide' }); mBox.appendChild(h('h3', { text: 'Mes mesures' }));
    var tw = h('div', { class: 'tw' }); mBox.appendChild(tw);
    var resBox = h('div', { class: 'results', 'aria-live': 'polite' }); mBox.appendChild(resBox);
    low.appendChild(mBox);
    var rBox = h('div', { class: 'box' }); rBox.appendChild(h('h3', { text: 'Je retiens' }));
    var ul = h('ul', { class: 'retiens' }); (def.retiens || []).forEach(function (t) { ul.appendChild(h('li', { html: t })); });
    rBox.appendChild(ul); low.appendChild(rBox);
    var qBox = h('div', { class: 'box quiz' }); qBox.appendChild(h('h3', { text: 'Quiz de vérification' })); low.appendChild(qBox);

    /* ---- API passée au module ---- */
    var updaters = [], resets = [], loops = [], tableRows = [], tableCfg = null, chart = null, last = 0, alive = true;
    var c = { s: function (t, a, p) { return s(t, a, p || svg); }, W: W, H: H, svg: svg, fmt: fmt, h: h };
    c.update = function () { updaters.forEach(function (f) { f(); }); };
    c.say = function (t, kind) { msg.className = 'msg' + (kind ? ' ' + kind : ''); msg.textContent = t; };
    c.noise = function (v, rel) { return v * (1 + (rel || 0.01) * gauss()); };
    c.rand = rnd;
    c.onReset = function (f) { resets.push(f); };
    c.onUpdate = function (f) { updaters.push(f); f(); };
    c.loop = function (f) { loops.push(f); };
    c.results = function (html) { resBox.innerHTML = html || ''; };

    c.slider = function (label, o) {
      var id = 'sl-' + Math.random().toString(36).slice(2, 8);
      var wrap = h('div', { class: 'ctl' });
      var out = h('output', { for: id });
      var lb = h('label', { for: id }); lb.appendChild(h('span', { html: label })); lb.appendChild(out); wrap.appendChild(lb);
      var inp = h('input', { type: 'range', id: id, min: o.min, max: o.max, step: o.step || 1, value: o.value });
      wrap.appendChild(inp); ctrlBox.appendChild(wrap);
      var dig = o.digits !== undefined ? o.digits : (String(o.step || 1).indexOf('.') >= 0 ? String(o.step).split('.')[1].length : 0);
      var api = {
        get: function () { return parseFloat(inp.value); },
        set: function (v) { inp.value = v; show(); },
        el: inp, wrap: wrap, disable: function (b) { inp.disabled = b; }
      };
      function show() { out.textContent = fmt(api.get(), dig) + (o.unit ? ' ' + o.unit : ''); }
      inp.addEventListener('input', function () { show(); if (o.onInput) o.onInput(api.get()); c.update(); });
      show(); resets.push(function () { inp.value = o.value; show(); if (o.onInput) o.onInput(o.value); });
      return api;
    };
    c.choice = function (label, opts, onChange, init) {
      var wrap = h('div', { class: 'ctl' }); wrap.appendChild(h('div', { class: 'lab', html: label }));
      var seg = h('div', { class: 'seg', role: 'group', 'aria-label': label.replace(/<[^>]+>/g, '') }); wrap.appendChild(seg);
      var cur = init !== undefined ? init : opts[0].v, btns = [];
      opts.forEach(function (op) {
        var b = h('button', { type: 'button', html: op.label, 'aria-pressed': String(op.v === cur) });
        b.onclick = function () { set(op.v, true); }; seg.appendChild(b); btns.push([b, op.v]);
      });
      function set(v, fire) { cur = v; btns.forEach(function (p) { p[0].setAttribute('aria-pressed', String(p[1] === v)); }); if (fire && onChange) onChange(v); c.update(); }
      ctrlBox.appendChild(wrap);
      resets.push(function () { set(init !== undefined ? init : opts[0].v, true); });
      return { get: function () { return cur; }, set: function (v) { set(v, true); }, wrap: wrap };
    };
    c.toggle = function (label, onChange, init) {
      var wrap = h('div', { class: 'ctl' }); var b = h('button', { type: 'button', class: 'btn', html: label, 'aria-pressed': String(!!init) });
      var on = !!init;
      function paint() { b.setAttribute('aria-pressed', String(on)); b.style.background = on ? 'var(--ink)' : ''; b.style.color = on ? 'var(--bg)' : ''; }
      b.onclick = function () { on = !on; paint(); if (onChange) onChange(on); c.update(); };
      paint(); wrap.appendChild(b); ctrlBox.appendChild(wrap);
      resets.push(function () { on = !!init; paint(); if (onChange) onChange(on); });
      return { get: function () { return on; }, set: function (v) { on = !!v; paint(); if (onChange) onChange(on); }, wrap: wrap };
    };
    c.button = function (label, fn, o) {
      o = o || {};
      var b = h('button', { type: 'button', class: 'btn' + (o.primary ? ' primary' : ''), html: label });
      if (o.hold) { /* maintenir appuyé */
        var t = null;
        var stop = function () { clearInterval(t); t = null; if (o.hold.up) o.hold.up(); };
        b.addEventListener('pointerdown', function (e) { e.preventDefault(); if (o.hold.down) o.hold.down(); t = setInterval(function () { o.hold.tick(); c.update(); }, o.hold.every || 80); });
        ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) { b.addEventListener(ev, function () { if (t) stop(); }); });
      } else b.onclick = function () { fn(); c.update(); };
      (o.into === 'ctrl' ? ctrlBox : actBox).appendChild(b);
      return b;
    };
    c.readout = function (label, fn, unit, digits) {
      var box = h('div', { class: 'read' }); var sm = h('small', { text: label }); var b = h('b', { text: '—' });
      box.appendChild(sm); box.appendChild(b); readBox.appendChild(box);
      var u = function () { var v = fn(); b.textContent = (typeof v === 'string' ? v : fmt(v, digits === undefined ? 1 : digits)) + (unit && typeof v !== 'string' ? ' ' + unit : ''); };
      updaters.push(u); u(); return box;
    };
    c.table = function (cfg) { /* cfg: {cols:[{key,label,unit,d,txt}], max, onChange(rows)} */
      tableCfg = cfg; renderTable();
    };
    function renderTable() {
      tw.innerHTML = ''; if (!tableCfg) { mBox.hidden = true; return; }
      var t = h('table', { class: 't' }); var hd = h('tr'); hd.appendChild(h('th', { text: 'n°' }));
      tableCfg.cols.forEach(function (k) { hd.appendChild(h('th', { text: k.label + (k.unit ? ' (' + k.unit + ')' : '') })); });
      hd.appendChild(h('th', { text: '' })); t.appendChild(hd);
      if (!tableRows.length) { var er = h('tr'); er.appendChild(h('td', { class: 'txt', colspan: String(tableCfg.cols.length + 2), text: 'Aucune mesure : appuie sur le bouton orange pour en relever.' })); t.appendChild(er); }
      tableRows.forEach(function (r, i) {
        var tr = h('tr'); tr.appendChild(h('td', { text: String(i + 1) }));
        tableCfg.cols.forEach(function (k) { var v = r[k.key]; tr.appendChild(h('td', { class: k.txt ? 'txt' : '', text: typeof v === 'number' ? fmt(v, k.d === undefined ? 1 : k.d) : (v === undefined ? '' : v) })); });
        var x = h('button', { type: 'button', class: 'x', 'aria-label': 'Supprimer la mesure ' + (i + 1), text: '×' });
        x.onclick = function () { tableRows.splice(i, 1); renderTable(); if (tableCfg.onChange) tableCfg.onChange(tableRows); };
        var td = h('td'); td.appendChild(x); tr.appendChild(td); t.appendChild(tr);
      });
      tw.appendChild(t);
    }
    c.measure = function (label, fn) {

        var r = fn(); if (!r) return;
        var max = (tableCfg && tableCfg.max) || 12;
        if (tableRows.length >= max) { c.say('Tableau plein (' + max + ' mesures) : supprime une ligne avec ×.', 'warn'); return; }
        tableRows.push(r); renderTable(); if (tableCfg && tableCfg.onChange) tableCfg.onChange(tableRows);
      }, { primary: true });
      return b;
    };
    c.rows = function () { return tableRows; };

    /* graphique */
    c.chart = function (cfg) {
      /* cfg: {x:{label,unit,min,max}, y:{...}, fit:'origin'|'line'|null, series:[{id,name,color}]} */
      chartHost.hidden = false; chartHost.innerHTML = '';
      var CW = 800, CH = 250, m = { l: 66, r: 20, t: 16, b: 46 };
      var cs = s('svg', { viewBox: '0 0 ' + CW + ' ' + CH, class: 'scene', role: 'img', 'aria-label': 'Graphique ' + cfg.y.label + ' en fonction de ' + cfg.x.label });
      chartHost.appendChild(cs);
      var pts = {}; var series = cfg.series || [{ id: 'a', name: '', color: 'var(--s1)' }];
      series.forEach(function (sr) { pts[sr.id] = []; });
      var marker = null;
      function sx(v) { return m.l + (v - cfg.x.min) / (cfg.x.max - cfg.x.min) * (CW - m.l - m.r); }
      function sy(v) { return CH - m.b - (v - cfg.y.min) / (cfg.y.max - cfg.y.min) * (CH - m.t - m.b); }
      function draw() {
        cs.innerHTML = '';
        nice(cfg.x.min, cfg.x.max, 8).forEach(function (v) { s('line', { x1: sx(v), x2: sx(v), y1: m.t, y2: CH - m.b, stroke: 'var(--scene-muted)', 'stroke-opacity': .25 }, cs); s('text', { x: sx(v), y: CH - m.b + 18, 'text-anchor': 'middle', 'font-size': 13, text: fmt(v, v % 1 ? 1 : 0) }, cs); });
        nice(cfg.y.min, cfg.y.max, 5).forEach(function (v) { s('line', { y1: sy(v), y2: sy(v), x1: m.l, x2: CW - m.r, stroke: 'var(--scene-muted)', 'stroke-opacity': .25 }, cs); s('text', { x: m.l - 8, y: sy(v) + 4, 'text-anchor': 'end', 'font-size': 13, text: fmt(v, v % 1 ? 1 : 0) }, cs); });
        s('rect', { x: m.l, y: m.t, width: CW - m.l - m.r, height: CH - m.t - m.b, fill: 'none', stroke: 'var(--scene-line)' }, cs);
        s('text', { x: (m.l + CW - m.r) / 2, y: CH - 8, 'text-anchor': 'middle', 'font-size': 14, text: cfg.x.label + (cfg.x.unit ? ' (' + cfg.x.unit + ')' : '') }, cs);
        s('text', { x: 16, y: (m.t + CH - m.b) / 2, 'text-anchor': 'middle', 'font-size': 14, transform: 'rotate(-90 16 ' + ((m.t + CH - m.b) / 2) + ')', text: cfg.y.label + (cfg.y.unit ? ' (' + cfg.y.unit + ')' : '') }, cs);
        series.forEach(function (sr, si) {
          var p = pts[sr.id];
          var f = fitOf(p);
          if (cfg.fit && f) {
            var x0 = cfg.x.min, x1 = cfg.x.max;
            s('line', { x1: sx(x0), y1: sy(f.a * x0 + f.b), x2: sx(x1), y2: sy(f.a * x1 + f.b), stroke: sr.color, 'stroke-width': 2, 'stroke-dasharray': '6 4', 'clip-path': 'url(#cl)' }, cs);
          }
          if (cfg.line) { var d = p.slice().sort(function (a, b) { return a[0] - b[0]; }).map(function (q, i) { return (i ? 'L' : 'M') + sx(q[0]) + ' ' + sy(q[1]); }).join(''); if (d) s('path', { d: d, fill: 'none', stroke: sr.color, 'stroke-width': 2 }, cs); }
          p.forEach(function (q) { s('circle', { cx: sx(q[0]), cy: sy(q[1]), r: 5, fill: sr.color, stroke: 'var(--scene)', 'stroke-width': 1.5 }, cs); });
          if (sr.name) { s('text', { x: m.l + 10 + si * 130, y: m.t + 16, 'font-size': 13, fill: sr.color, text: '● ' + sr.name }, cs).style.fill = sr.color; }
        });
        if (marker) s('circle', { cx: sx(marker[0]), cy: sy(marker[1]), r: 7, fill: 'none', stroke: 'var(--accent)', 'stroke-width': 3 }, cs);
        var defs = s('defs', {}, cs); var cp = s('clipPath', { id: 'cl' }, defs); s('rect', { x: m.l, y: m.t, width: CW - m.l - m.r, height: CH - m.t - m.b }, cp);
      }
      function fitOf(p) {
        if (p.length < 2) return null; var n = p.length, sxx = 0, sxy = 0, sx1 = 0, sy1 = 0;
        if (cfg.fit === 'origin') { p.forEach(function (q) { sxx += q[0] * q[0]; sxy += q[0] * q[1]; }); return sxx ? { a: sxy / sxx, b: 0 } : null; }
        p.forEach(function (q) { sx1 += q[0]; sy1 += q[1]; sxx += q[0] * q[0]; sxy += q[0] * q[1]; });
        var den = n * sxx - sx1 * sx1; if (!den) return null; var a = (n * sxy - sx1 * sy1) / den; return { a: a, b: (sy1 - a * sx1) / n };
      }
      var api = {
        point: function (x, y, id) { pts[id || series[0].id].push([x, y]); draw(); },
        setPoints: function (arr, id) { pts[id || series[0].id] = arr.slice(); draw(); },
        clear: function (id) { if (id) pts[id] = []; else series.forEach(function (sr) { pts[sr.id] = []; }); marker = null; draw(); },
        marker: function (x, y) { marker = (x === null || x === undefined) ? null : [x, y]; draw(); },
        fit: function (id) { return fitOf(pts[id || series[0].id]); },
        count: function (id) { return pts[id || series[0].id].length; }
      };
      draw(); resets.push(function () { api.clear(); });
      c.chartApi = api; return api;
    };

    c.drag = function (el, o) { /* souris et doigt ; coordonnées SVG */
      function pt(e) { var r = svg.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
      var on = false;
      el.style.cursor = 'grab'; el.style.touchAction = 'none';
      el.addEventListener('pointerdown', function (e) { on = true; el.setPointerCapture(e.pointerId); e.preventDefault(); var p = pt(e); if (o.start) o.start(p.x, p.y, e); });
      el.addEventListener('pointermove', function (e) { if (!on) return; var p = pt(e); if (o.move) o.move(p.x, p.y, e); c.update(); });
      var end = function (e) { if (!on) return; on = false; var p = pt(e); if (o.end) o.end(p.x, p.y, e); };
      el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
    };

    c.button('Remettre à zéro', function () {
      tableRows = []; renderTable(); resBox.innerHTML = ''; resets.forEach(function (f) { f(); }); c.say(def.hint || 'Manipule les commandes.'); c.update();
    });

    /* ---- construction ---- */
    def.build(c);
    if (!tableCfg) mBox.hidden = true;
    c.update();

    /* ---- quiz ---- */
    (function () {
      var qi = 0, score = 0; var body = h('div'); qBox.appendChild(body);
      function show() {
        body.innerHTML = '';
        if (qi >= def.quiz.length) {
          store('p3-q-' + def.id, Math.max(store('p3-q-' + def.id) || 0, score));
          body.appendChild(h('p', { class: 'q', text: 'Score : ' + score + ' / ' + def.quiz.length + (score >= 4 ? ' — badge gagné !' : ' — relis « Je retiens » et recommence.') }));
          var r = h('button', { type: 'button', class: 'btn', text: 'Recommencer' }); r.onclick = function () { qi = 0; score = 0; show(); }; body.appendChild(r); return;
        }
        var q = def.quiz[qi];
        body.appendChild(h('div', { class: 'sr', text: 'Question ' + (qi + 1) }));
        body.appendChild(h('p', { class: 'q', html: (qi + 1) + '/' + def.quiz.length + ' — ' + q.q }));
        var done = false;
        q.o.forEach(function (t, i) {
          var b = h('button', { type: 'button', class: 'opt', html: t });
          b.onclick = function () {
            if (done) return; done = true; if (i === q.a) score++;
            Array.prototype.forEach.call(body.querySelectorAll('.opt'), function (x, j) { x.classList.add(j === q.a ? 'good' : (j === i ? 'wrong' : '')); });
            body.appendChild(h('p', { class: 'ex', html: (i === q.a ? 'Bravo. ' : 'Pas tout à fait. ') + q.e }));
            var n = h('button', { type: 'button', class: 'btn primary', text: qi + 1 < def.quiz.length ? 'Question suivante' : 'Voir mon score' }); n.onclick = function () { qi++; show(); }; body.appendChild(n);
          };
          body.appendChild(b);
        });
      }
      show();
    })();

    /* ---- animation ---- */
    function frame(t) {
      if (!alive || Lab.cur !== def) return;
      var dt = Math.min(0.05, (t - last) / 1000 || 0); last = t;
      loops.forEach(function (f) { f(dt, t / 1000); });
      requestAnimationFrame(frame);
    }
    if (loops.length) requestAnimationFrame(function (t) { last = t; requestAnimationFrame(frame); });
  }

  /* ---------- routage ---------- */
  function route() {
    var app = document.getElementById('app'); var id = location.hash.replace('#', '');
    var def = Lab.reg[id];
    Lab.cur = def || null;
    if (def) run(def, app); else home(app);
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);
  Lab.start = route;
})();

<script>
/* ==== m01-forces.js ==== */
/* Masse, poids et caractéristiques d'une force */
Lab.register({
  id: 'forces', theme: 'meca', title: 'Le poids d’un objet suspendu',
  lesson: 'Masse et poids · Les forces', skills: ['C1', 'C2', 'C4'],
  objective: 'Décris le poids avec ses 4 caractéristiques, puis trouve la relation entre poids et masse.',
  alt: 'Objet suspendu à un dynamomètre, avec la flèche du poids dirigée vers le bas',
  thumb: '<rect x="62" y="12" width="36" height="14" rx="3" fill="var(--metal)"/><path d="M80 26v14" stroke="var(--scene-text)" stroke-width="3"/><rect x="66" y="40" width="28" height="22" rx="3" fill="var(--s2)"/><path d="M80 62v10M74 67l6 8 6-8" stroke="var(--bad)" stroke-width="3" fill="none"/>',
  height: 420,
  hint: 'Change la masse et le lieu, puis relève plusieurs mesures.',
  steps: [
    'Choisis un lieu (valeur de g) et règle la masse de l’objet.',
    'Lis la valeur du poids sur le dynamomètre et observe la flèche.',
    'Appuie sur « Relever » pour au moins 4 masses différentes.',
    'Observe le graphique : P en fonction de m est une droite qui passe par l’origine.'
  ],
  retiens: [
    'Le <b>poids</b> P est la force d’attraction exercée par la Terre sur un objet. Il se mesure en <b>newton (N)</b> avec un dynamomètre.',
    'Caractéristiques : <b>point d’application</b> = centre de gravité ; <b>direction</b> = verticale ; <b>sens</b> = vers le bas ; <b>valeur</b> P.',
    '<b>P = m × g</b> (m en kg, g en N/kg). Sur Terre g ≈ 9,8 N/kg (on prend souvent 10) ; sur la Lune g ≈ 1,6 N/kg.',
    'La masse ne change pas avec le lieu ; le poids change.'
  ],
  quiz: [
    { q: 'Quelle est la direction du poids d’un objet ?', o: ['Horizontale', 'Verticale', 'Oblique', 'Elle dépend de l’objet'], a: 1, e: 'Le poids est dirigé suivant la verticale du lieu, vers le centre de la Terre.' },
    { q: 'Un objet de 3 kg est pesé sur Terre (g = 10 N/kg). Son poids vaut :', o: ['3 N', '13 N', '30 N', '0,3 N'], a: 2, e: 'P = m × g = 3 × 10 = 30 N.' },
    { q: 'Le même objet est emporté sur la Lune. Qu’est-ce qui change ?', o: ['Sa masse seulement', 'Son poids seulement', 'Sa masse et son poids', 'Rien'], a: 1, e: 'La masse est la quantité de matière : elle ne change pas. Le poids dépend de g.' },
    { q: 'Quelle est l’unité du poids ?', o: ['le kilogramme', 'le newton', 'le joule', 'le watt'], a: 1, e: 'Une force se mesure en newton (N).' },
    { q: 'Où se situe le point d’application du poids ?', o: ['Au sol', 'Au crochet du dynamomètre', 'Au centre de gravité de l’objet', 'Au point le plus haut'], a: 2, e: 'On représente le poids à partir du centre de gravité.' }
  ],
  build: function (c) {
    var LIEUX = { t98: { g: 9.8, n: 'Terre (g = 9,8)', col: 'var(--s1)' }, t10: { g: 10, n: 'Terre (g = 10)', col: 'var(--s3)' }, lune: { g: 1.6, n: 'Lune (g = 1,6)', col: 'var(--s4)' } };
    var K = 3;   // px par newton
    var m = c.slider('Masse m', { min: 0.1, max: 5, step: 0.1, value: 2, unit: 'kg' });
    var lieu = c.choice('Lieu', [{ v: 't98', label: 'Terre 9,8' }, { v: 't10', label: 'Terre 10' }, { v: 'lune', label: 'Lune' }], null, 't98');
    function g() { return LIEUX[lieu.get()].g; }

    c.s('rect', { x: 40, y: 20, width: 720, height: 380, rx: 14, fill: 'var(--scene2)', stroke: 'var(--scene-line)' });
    c.s('rect', { x: 170, y: 30, width: 160, height: 14, rx: 3, fill: 'var(--metal)' });
    c.s('rect', { x: 230, y: 44, width: 40, height: 100, rx: 6, fill: 'var(--glass)', stroke: 'var(--scene-line)' });
    for (var i = 0; i <= 5; i++) { c.s('line', { x1: 230, x2: 242, y1: 54 + i * 16, y2: 54 + i * 16, stroke: 'var(--scene-text)' }); }
    var rod = c.s('line', { x1: 250, x2: 250, y1: 144, stroke: 'var(--scene-text)', 'stroke-width': 3 });
    var needle = c.s('rect', { x: 230, width: 40, height: 4, fill: 'var(--bad)' });
    var box = c.s('rect', { rx: 5, fill: 'var(--s2)', stroke: 'var(--scene-text)', 'stroke-width': 2 });
    var boxT = c.s('text', { 'font-size': 15, 'text-anchor': 'end', 'font-weight': 700 });
    var arrow = c.s('path', { fill: 'var(--bad)' });
    var dot = c.s('circle', { r: 5, fill: 'var(--scene-text)' });
    var pl = c.s('text', { 'font-size': 16, 'font-weight': 700 }); pl.style.fill = 'var(--bad)';
    c.s('line', { x1: 540, x2: 540 + 10 * K, y1: 70, y2: 70, stroke: 'var(--scene-text)', 'stroke-width': 3 });
    c.s('text', { x: 540, y: 58, 'font-size': 13, text: 'Échelle : 10 N' });
    var car = [c.s('text', { x: 430, y: 120, 'font-size': 15 }), c.s('text', { x: 430, y: 150, 'font-size': 15 }), c.s('text', { x: 430, y: 180, 'font-size': 15 }), c.s('text', { x: 430, y: 210, 'font-size': 15 })];
    c.s('text', { x: 430, y: 96, 'font-size': 15, 'font-weight': 700, text: 'Caractéristiques du poids' });

    c.onUpdate(function () {
      var p = P(), st = p * 0.8, sz = 36 + 10 * Math.cbrt(m.get()), top = 154 + st;
      rod.setAttribute('y2', top); needle.setAttribute('y', 52 + p * 1.6 > 138 ? 138 : 52 + p * 1.6);
      box.setAttribute('x', 250 - sz / 2); box.setAttribute('y', top); box.setAttribute('width', sz); box.setAttribute('height', sz);
      boxT.setAttribute('x', 250 - sz / 2 - 8); boxT.setAttribute('y', top + sz / 2 + 5); boxT.textContent = c.fmt(m.get(), 1) + ' kg';
      var cy = top + sz / 2, L = p * K; dot.setAttribute('cx', 250); dot.setAttribute('cy', cy);
      if (L < 6) arrow.setAttribute('d', ''); else {
        var hd = Math.min(14, L * .5), y1 = cy + L;
        arrow.setAttribute('d', 'M246 ' + cy + 'H254V' + (y1 - hd) + 'H260L250 ' + y1 + 'L240 ' + (y1 - hd) + 'H246Z');
      }
      pl.setAttribute('x', 275); pl.setAttribute('y', cy + Math.max(L, 20) / 2 + 4); pl.textContent = 'P = ' + c.fmt(p, 1) + ' N';
      car[0].textContent = 'Point d’application : centre de gravité (●)';
      car[1].textContent = 'Direction : verticale';
      car[2].textContent = 'Sens : vers le bas';
      car[3].textContent = 'Valeur : P = m × g = ' + c.fmt(m.get(), 1) + ' × ' + c.fmt(g(), 1) + ' = ' + c.fmt(p, 1) + ' N';
    });

    c.readout('Masse m', function () { return m.get(); }, 'kg', 1);
    c.readout('g (lieu)', function () { return g(); }, 'N/kg', 1);
    c.readout('Dynamomètre : P', function () { return c.noise(P(), 0.004); }, 'N', 1);

    var series = Object.keys(LIEUX).map(function (k) { return { id: k, name: LIEUX[k].n, color: LIEUX[k].col }; });
    var ch = c.chart({ x: { label: 'masse m', unit: 'kg', min: 0, max: 5 }, y: { label: 'poids P', unit: 'N', min: 0, max: 50 }, fit: 'origin', series: series });
    c.table({ cols: [{ key: 'lieu', label: 'lieu', txt: true }, { key: 'm', label: 'm', unit: 'kg', d: 1 }, { key: 'p', label: 'P', unit: 'N', d: 1 }, { key: 'r', label: 'P / m', unit: 'N/kg', d: 2 }], max: 12, onChange: bilan });
    c.measure('Relever la mesure', function () {
      var p = c.noise(P(), 0.004); return { k: lieu.get(), lieu: LIEUX[lieu.get()].n, m: m.get(), p: p, r: p / m.get() };
    });
    function bilan(rows) {
      Object.keys(LIEUX).forEach(function (k) { ch.setPoints(rows.filter(function (r) { return r.k === k; }).map(function (r) { return [r.m, r.p]; }), k); });
      var best = null;
      Object.keys(LIEUX).forEach(function (k) { var rr = rows.filter(function (r) { return r.k === k; }); if (rr.length >= 3 && (!best || rr.length > best.n)) best = { k: k, n: rr.length, a: ch.fit(k).a }; });

    }
  }
});

    { q: 'Deux forces de 3 N, de même direction et de même sens, agissent sur un solide. Que se passe-t-il ?', o: ['Il est en équilibre', 'Il se déplace dans le sens des forces', 'Il tourne sur place sans bouger', 'Rien, car les valeurs sont égales'], a: 1, e: 'Les sens ne sont pas opposés : les effets s’ajoutent (6 N au total).' },
    { q: 'Un solide en équilibre subit F1 = 4 N vers la gauche. Que vaut F2 ?', o: ['2 N vers la gauche', '4 N vers la droite', '8 N vers la droite', '0 N'], a: 1, e: 'F2 compense F1 : 4 N dans le sens contraire.' },
    { q: 'Une lampe est suspendue à un fil, immobile. Le fil exerce une force de 5 N. Quel est le poids de la lampe ?', o: ['0 N', '2,5 N', '5 N', '10 N'], a: 2, e: 'Poids et tension du fil s’équilibrent : même valeur, 5 N.' },
    { q: 'Deux forces de même valeur tirent l’anneau dans des directions non opposées. L’anneau :', o: ['reste au centre', 'se déplace', 'disparaît', 'change de masse'], a: 1, e: 'Même valeur ne suffit pas : il faut aussi la même droite et des sens opposés.' }
  ],
  build: function (c) {
    var CX = 400, CY = 210, K = 30, R = 175;   // K : pixels par newton
    var f1 = c.slider('Force F<sub>1</sub>', { min: 0.5, max: 5, step: 0.1, value: 3, unit: 'N' });
    var a1 = c.slider('Direction du fil 1', { min: 0, max: 359, step: 1, value: 155, unit: '°' });
    var f2 = c.slider('Force F<sub>2</sub>', { min: 0.5, max: 5, step: 0.1, value: 2, unit: 'N' });
    var a2 = c.slider('Direction du fil 2', { min: 0, max: 359, step: 1, value: 25, unit: '°' });
    var off = { x: 0, y: 0 };

    // décor : planche et repère central
    c.s('rect', { x: 30, y: 24, width: 740, height: 372, rx: 14, fill: 'var(--scene2)', stroke: 'var(--scene-line)' });
    c.s('circle', { cx: CX, cy: CY, r: 16, fill: 'none', stroke: 'var(--scene-muted)', 'stroke-dasharray': '4 4' });
    c.s('text', { x: 60, y: 54, 'font-size': 14, text: 'Repère central' }).style.fill = 'var(--scene-muted)';
    var g = c.s('g');
    var strings = [], handles = [], boxes = [], arrows = [], labels = [];
    var cols = ['var(--s1)', 'var(--s2)'];
    for (var i = 0; i < 2; i++) {
      strings.push(c.s('line', { stroke: 'var(--scene-text)', 'stroke-width': 2 }, g));
      boxes.push(c.s('rect', { width: 70, height: 22, rx: 5, fill: cols[i], stroke: 'var(--scene)', 'stroke-width': 1.5 }, g));
      labels.push(c.s('text', { 'font-size': 13, 'text-anchor': 'middle', 'font-weight': 700, fill: '#fff' }, g));
      labels[i].style.fill = '#fff';
      arrows.push(c.s('path', { fill: cols[i], 'fill-opacity': .85 }, g));
      handles.push(c.s('circle', { r: 22, fill: cols[i], 'fill-opacity': .22, stroke: cols[i], 'stroke-width': 2 }, g));
    }
    var resArrow = c.s('path', { fill: 'var(--bad)', 'fill-opacity': .9 }, g);
    var resText = c.s('text', { x: 750, y: 54, 'font-size': 15, 'font-weight': 700, 'text-anchor': 'end' }, g); resText.style.fill = 'var(--bad)';
    var ring = c.s('circle', { r: 14, fill: 'none', stroke: 'var(--scene-text)', 'stroke-width': 6 }, g);

    function vec(f, a) { var r = a * Math.PI / 180; return { x: f * Math.cos(r), y: -f * Math.sin(r) }; }
    function netF() { var u = vec(f1.get(), a1.get()), v = vec(f2.get(), a2.get()); return { x: u.x + v.x, y: u.y + v.y }; }
    function arrow(el, x0, y0, dx, dy) {
      var L = Math.hypot(dx, dy); if (L < 3) { el.setAttribute('d', ''); return; }
      var ux = dx / L, uy = dy / L, nx = -uy, ny = ux, hd = Math.min(14, L * .5), w = 4;
      var x1 = x0 + dx, y1 = y0 + dy, bx = x1 - ux * hd, by = y1 - uy * hd;
      el.setAttribute('d', 'M' + (x0 + nx * w) + ' ' + (y0 + ny * w) + 'L' + (bx + nx * w) + ' ' + (by + ny * w) + 'L' + (bx + nx * 10) + ' ' + (by + ny * 10) + 'L' + x1 + ' ' + y1 + 'L' + (bx - nx * 10) + ' ' + (by - ny * 10) + 'L' + (bx - nx * w) + ' ' + (by - ny * w) + 'L' + (x0 - nx * w) + ' ' + (y0 - ny * w) + 'Z');
    }
    function draw() {
      var px = CX + off.x, py = CY + off.y, F = [f1.get(), f2.get()], A = [a1.get(), a2.get()];
      for (var i = 0; i < 2; i++) {
        var r = A[i] * Math.PI / 180, ux = Math.cos(r), uy = -Math.sin(r);
        var hx = CX + ux * R, hy = CY + uy * R;
        strings[i].setAttribute('x1', px); strings[i].setAttribute('y1', py); strings[i].setAttribute('x2', hx); strings[i].setAttribute('y2', hy);
        handles[i].setAttribute('cx', hx); handles[i].setAttribute('cy', hy);
        var bx = px + ux * 100, by = py + uy * 100;
        boxes[i].setAttribute('x', bx - 35); boxes[i].setAttribute('y', by - 11);
        labels[i].setAttribute('x', bx); labels[i].setAttribute('y', by + 5); labels[i].textContent = 'F' + (i + 1) + ' = ' + c.fmt(F[i], 1) + ' N';
        arrow(arrows[i], px, py, ux * F[i] * K, uy * F[i] * K);
      }
      var n = netF(), L = Math.hypot(n.x, n.y);
      arrow(resArrow, px, py, n.x * K, n.y * K); resArrow.style.display = L > 0.12 ? '' : 'none';
      resText.textContent = L > 0.12 ? 'Somme des forces (flèche rouge) : ' + c.fmt(L, 1) + ' N' : 'Somme des forces nulle';
      ring.setAttribute('cx', px); ring.setAttribute('cy', py);
    }
    c.onUpdate(draw);

    // poignées glissables : règlent la direction du fil
    [0, 1].forEach(function (i) {
      c.drag(handles[i], { move: function (x, y) {
        var a = Math.atan2(-(y - CY), x - CX) * 180 / Math.PI; if (a < 0) a += 360; (i ? a2 : a1).set(Math.round(a) % 360);
      } });
    });

    function state() {
      var n = netF(), L = Math.hypot(n.x, n.y);
      var d = Math.abs(((a1.get() - a2.get()) % 360 + 540) % 360 - 180);   // écart par rapport à 180°
      var eq = L < 0.15;
      return { L: L, d: d, eq: eq };
    }
    c.loop(function (dt) {   // l'anneau glisse vers un décalage proportionnel à la somme des forces
      var n = netF(), tx = Math.max(-150, Math.min(150, n.x * 38)), ty = Math.max(-150, Math.min(150, n.y * 38));
      var k = 1 - Math.exp(-6 * dt); off.x += (tx - off.x) * k; off.y += (ty - off.y) * k; draw();
    });
    var lastTip = '';
    c.onUpdate(function () {
      var st = state(), tip;
      if (st.eq) tip = 'L’anneau est en équilibre : forces de même valeur, sur la même droite, de sens opposés.';
      else if (st.d > 3 && Math.abs(f1.get() - f2.get()) < 0.15) tip = 'Les valeurs sont égales, mais les fils ne sont pas alignés : l’anneau se déplace.';
      else if (st.d <= 3) tip = 'Les fils sont alignés et opposés, mais les valeurs sont différentes : l’anneau se déplace vers la plus grande force.';
      else tip = 'Il manque encore une condition : regarde l’angle entre les fils et les valeurs.';
      if (tip !== lastTip) { c.say(tip, st.eq ? 'ok' : 'warn'); lastTip = tip; }
    });

    c.readout('F₁ (dynamomètre 1)', function () { return c.noise(f1.get(), 0.005); }, 'N', 2);
    c.readout('F₂ (dynamomètre 2)', function () { return c.noise(f2.get(), 0.005); }, 'N', 2);
    c.readout('Angle entre les fils', function () { var d = Math.abs(a1.get() - a2.get()); return d > 180 ? 360 - d : d; }, '°', 0);
    c.readout('Somme des forces', function () { return state().L; }, 'N', 2);

    c.table({ cols: [{ key: 'f1', label: 'F₁', unit: 'N', d: 1 }, { key: 'f2', label: 'F₂', unit: 'N', d: 1 }, { key: 'ang', label: 'angle entre les fils', unit: '°', d: 0 }, { key: 'som', label: 'somme', unit: 'N', d: 2 }, { key: 'etat', label: 'anneau', txt: true }], onChange: bilan });
    c.measure('Relever cet essai', function () {
      var st = state(), d = Math.abs(a1.get() - a2.get()); if (d > 180) d = 360 - d;
      return { f1: f1.get(), f2: f2.get(), ang: d, som: st.L, etat: st.eq ? 'immobile' : 'se déplace' };
    });
    function bilan(rows) {
      var eqs = rows.filter(function (r) { return r.etat === 'immobile'; });
      if (eqs.length >= 2) {
        var ok = eqs.every(function (r) { return Math.abs(r.f1 - r.f2) < 0.16 && Math.abs(r.ang - 180) < 4; });
        c.results(ok ? '<b>Conclusion :</b> dans tous les cas d’équilibre, F₁ = F₂ et l’angle entre les fils vaut 180° (même droite, sens opposés).' : 'Vérifie tes essais en équilibre : les valeurs et l’angle devraient respecter les trois conditions.');
      } else c.results(rows.length ? 'Trouve au moins deux essais où l’anneau est immobile pour conclure.' : '');
    }
  }
});

    { q: 'On double la distance parcourue, la force restant la même. Le travail :', o: ['est divisé par 2', 'ne change pas', 'double', 'est multiplié par 4'], a: 2, e: 'W est proportionnel à d.' },

    function W() { return F.get() * D.get() * Math.cos(ang.get() * Math.PI / 180); }

    function vol(k) { return k === 'L' ? vL : vR; }

    function bilan(rows) {

      else c.results(rows.length ? 'Relève au moins 3 mesures.' : '');
    }
  }
});
