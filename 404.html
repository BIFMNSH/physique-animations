<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page introuvable · NOHOBA-Lab</title>
<meta name="description" content="Cette page n’existe pas ou a changé d’adresse. Retrouve les leçons, les simulations et les animations de NOHOBA-Lab.">
<link rel="icon" href="/assets/brand/nohoba-icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<style>
:root{color-scheme:light dark;--bg:#F6F2EA;--ink:#0E162A;--mist:#505A70;--line:rgba(14,22,42,.16);--acc:#C2410C}
@media (prefers-color-scheme:dark){:root{--bg:#0A1226;--ink:#EEF2FB;--mist:#A4B0CC;--line:rgba(164,176,204,.22);--acc:#E2541B}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:400 18px/1.55 'Atkinson Hyperlegible',system-ui,sans-serif}
main{max-width:640px;padding:32px 20px}
h1{font:800 clamp(34px,7vw,56px)/1.05 'Bricolage Grotesque',sans-serif;letter-spacing:-.03em;margin:0 0 12px}
p{color:var(--mist);margin:0 0 24px}
.l{display:flex;flex-wrap:wrap;gap:12px}
a{display:inline-flex;align-items:center;min-height:48px;padding:12px 22px;border-radius:14px;border:1.5px solid var(--line);color:var(--ink);font-weight:700;text-decoration:none}
a.go{background:#C2410C;border-color:#C2410C;color:#fff}
:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
</style>
</head>
<body>
<main>
  <h1>Cette page est introuvable.</h1>
  <p>L’adresse est peut-être incorrecte, ou la page a changé de place. Reprends depuis l’accueil.</p>
  <div class="l"><a class="go" href="/">Retour à l’accueil</a><a href="/lecons/">Les leçons</a><a href="/simulateur/">Les simulations</a></div>
</main>
</body>
</html>
