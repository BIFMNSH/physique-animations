<!doctype html>
<html lang="fr" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script>try{var p=JSON.parse(localStorage.getItem('pc-studio')||'{}');var t=p.theme||localStorage.getItem('pc-theme');document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark')}catch(e){}</script>
<title>Leçon de 6e · NOHOBA-Lab</title>
<meta name="description" content="Comprendre, manipuler et investiguer autour des leçons de physique-chimie de sixième, programme ivoirien.">
<link rel="icon" href="../assets/brand/nohoba-icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<link rel="stylesheet" href="../assets/simple/simple.css">
<style>
.ls-theme{margin:0;font-weight:700;font-size:16px;color:var(--tc,var(--soft))}
.ls-prog{display:flex;flex-direction:column;gap:8px}
.ls-prog .sp-bar i{height:10px;border-radius:5px}
.ls-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.ls-step{min-height:76px;border-radius:18px;background:var(--panel);padding:12px 16px;display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--text)}
.ls-step .n{width:40px;height:40px;border-radius:20px;border:2px solid var(--line2);display:flex;align-items:center;justify-content:center;font:800 18px 'Bricolage Grotesque',sans-serif;flex-shrink:0}
.ls-step .tx{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.ls-step .tx b{font:800 22px/1.15 'Bricolage Grotesque',sans-serif}
.ls-step .tx span{font-size:16px;color:var(--soft);line-height:1.35}
.ls-step .st{font-size:15px;font-weight:700;white-space:nowrap;color:var(--muted)}
.ls-step.next{outline:2px solid var(--go)}
.ls-step.next .n{background:var(--go);border-color:var(--go);color:var(--on-go)}
.ls-step.next .st{color:var(--go-ink)}
.ls-step.done .n{background:var(--line2);border-color:var(--line2)}
.ls-step.done .st{color:var(--t-green)}
.ls-step.locked{opacity:.62}
.ls-step.locked .tx span{color:var(--muted)}
.ls-step svg{width:18px;height:18px;vertical-align:-3px}
.ls-bonus{font-size:16px;color:var(--soft);min-height:44px;display:inline-flex;align-items:center}
.ls-pager{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ls-pager a{border-radius:16px;border:1px solid var(--line);padding:12px 14px;text-decoration:none;display:flex;flex-direction:column;gap:2px;min-height:64px}
.ls-pager a small{font-size:14px;color:var(--muted)}
.ls-pager a b{font-size:16px;line-height:1.25}
.ls-pager a.nx{text-align:right;grid-column:2}
.ls-prof{display:flex;flex-wrap:wrap;align-items:center;gap:0 18px;font-size:15px;color:var(--muted)}
.ls-prof a{color:var(--soft);min-height:44px;display:inline-flex;align-items:center}
@media (min-width:760px){.ls-steps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}#go{align-self:flex-start;min-width:340px}}
</style></head>
<body>
<a class="sp-skip" href="#etapes">Aller aux étapes</a>
<div class="sp">
  <header class="sp-top">
    <a class="sp-round" href="../6e/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>Mes leçons</a>
    <button type="button" class="sp-round" data-sp-theme aria-label="Changer de thème"></button>
  </header>
  <main class="sp-main" id="main">
    <div style="display:flex;flex-direction:column;gap:8px">
      <p class="ls-theme" id="theme"></p>
      <h1 class="sp-h1" id="title" style="font-size:clamp(30px,8.5vw,44px)">Le circuit électrique</h1>
    </div>
    <div class="ls-prog"><span class="sp-bar" id="bar"></span><span class="sp-note" id="count"></span></div>
    <a class="sp-btn" id="go" href="#"></a>
    <section aria-labelledby="etapes" style="display:flex;flex-direction:column;gap:12px">
      <h2 class="sp-h2" id="etapes">Les 4 étapes</h2>
      <ol class="ls-steps" id="steps"></ol>
      <a class="ls-bonus" id="bonus" href="#" hidden></a>
    </section>
    <nav class="ls-pager" aria-label="Autres leçons"><a id="prev" href="#" hidden><small>← Leçon d’avant</small><b></b></a><a id="next" class="nx" href="#" hidden><small>Leçon suivante →</small><b></b></a></nav>
  </main>
  <footer style="display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:14px">
    <nav class="ls-prof" aria-label="Pour le professeur"><span>Pour le prof :</span><a id="fiche" href="#">Imprimer la fiche</a><a id="tests" href="../collections/" hidden></a></nav>
    <p class="sp-note">Tes réponses restent sur cet appareil.</p>
  </footer>
</div>
<script src="../assets/studio/programme.js"></script>
<script src="../assets/catalogues/6e-ci.js"></script>
<script src="../assets/simple/simple.js"></script>
<script src="../assets/simple/etapes-ci.js"></script>
<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id);};
var TC={'var(--amber)':'var(--t-amber)','var(--blue)':'var(--t-blue)','var(--green)':'var(--t-green)','var(--violet)':'var(--t-violet)'};
var LOCK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
var lessons=[];((window.PROGRAMME&&window.PROGRAMME['6e'])||[]).forEach(function(t){t.les.forEach(function(l){lessons.push({slug:l.slug,title:l.t,theme:t.nm,col:t.col});});});
var slug=new URL(location.href).searchParams.get('l')||'circuit-electrique';
if(!lessons.some(function(x){return x.slug===slug;}))slug='circuit-electrique';
function render(){
  var idx=lessons.findIndex(function(x){return x.slug===slug;}),l=lessons[idx],R=window.NohobaEtapesCI.etapes(slug);
  document.title=l.title+' · 6e · NOHOBA-Lab';
  $('theme').textContent=l.theme;$('theme').style.setProperty('--tc',TC[l.col]||'var(--soft)');$('title').textContent=l.title;
  var bar='';for(var i=0;i<4;i++)bar+='<i'+(i<R.done?' class="on"':'')+'></i>';$('bar').innerHTML=bar;
  $('bar').setAttribute('role','img');$('bar').setAttribute('aria-label',R.done+' étape'+(R.done>1?'s':'')+' sur 4 terminée'+(R.done>1?'s':''));
  $('count').textContent=R.done===4?'Leçon terminée. Bravo !':R.done+' étape'+(R.done>1?'s':'')+' sur 4';
  var nx=lessons[idx+1],go=$('go');
  if(R.next){go.href=R.next.href;go.textContent=(R.next.started?'Continuer':'Commencer')+' : '+R.next.mot+' →';}
  else if(nx){go.href='?l='+nx.slug;go.textContent='Leçon suivante →';}
  else{go.href='../6e/';go.textContent='Revenir à mes leçons';}
  $('steps').innerHTML=R.list.map(function(e){
    var cls=e.done?'done':e.locked?'locked':(R.next&&R.next.k===e.k?'next':'');
    var st=e.done?'Fait ✓':e.locked?LOCK+' Après l’étape 1':(R.next&&R.next.k===e.k?(e.started?'En cours':'À toi'):'');
    var inner='<span class="n" aria-hidden="true">'+e.n+'</span><span class="tx"><b>'+e.mot+'</b><span>'+esc(e.d)+'</span></span>'+(st?'<span class="st">'+st+'</span>':'');
    var label='Étape '+e.n+' : '+e.mot+(e.done?', faite':e.locked?', disponible après l’étape 1':'');
    return '<li>'+(e.locked?'<div class="ls-step '+cls+'" aria-label="'+label+'">'+inner+'</div>':'<a class="ls-step '+cls+'" href="'+e.href+'" aria-label="'+label+'"'+(cls==='next'?' aria-current="step"':'')+'>'+inner+'</a>')+'</li>';
  }).join('');
  var b=$('bonus');b.hidden=!R.defiBonus||R.defiBonus.locked;if(R.defiBonus){b.href=R.defiBonus.href;b.textContent=R.defiBonus.done?'Bonus : le défi chronométré (fait ✓)':'Bonus : le défi chronométré →';}
  var pv=lessons[idx-1],P=$('prev'),N=$('next');P.hidden=!pv;N.hidden=!nx;
  if(pv){P.href='?l='+pv.slug;P.querySelector('b').textContent=pv.title;}if(nx){N.href='?l='+nx.slug;N.querySelector('b').textContent=nx.title;}
  $('fiche').href='../lecon/?l='+slug+'&imprimer=fiche';
  var A=window.NohobaEtapesCI.activites(slug).filter(function(a){return a.statut==='prototype';}),T=$('tests');
  T.hidden=!A.length;T.textContent=A.length+' activité'+(A.length>1?'s':'')+' en test';
}
window.NohobaSimple.bindTheme();
render();
window.addEventListener('pageshow',function(e){if(e.persisted)render();});
})();
</script>
</body></html>
